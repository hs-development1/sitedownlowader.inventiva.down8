const items=[{"title": "Creatio administration and configuration (LATAM) | Creatio Academy", "url": "https://academy.creatio.com/creatio-administration-and-configuration-latam-1", "file": "paginas/01/01f004151-creatio-administration-and-configuration-latam-1.html", "kind": "general", "description": "", "text": "Hybrid learning Business Studio No-Code Creator Creatio administration and configuration (LATAM) Este curso de aprendizaje híbrido está destinado a creadores de No-Code, consultores de implementación, coordinadores de CRM, analistas de negocios y otros usuarios que estén familiarizados con cualquier producto de Creatio a nivel de usuario final y deseen aprender más sobre sus capacidades de personalización. El formato de aprendizaje híbrido combina la flexibilidad de las lecciones de video a ritmo individual con la interactividad de las sesiones de preguntas y respuestas en vivo con un formador técnico de Creatio para crear una experiencia de aprendizaje dinámica e interesante. Los participantes pueden ver videos concisos, diseñados por expertos, a su propio ritmo para desarrollar conocimientos básicos y habilidades prácticas. Para reforzar el aprendizaje, las sesiones regulares de preguntas y respuestas en vivo con formadores técnicos de Creatio brindan la oportunidad de aclarar conceptos, discutir aplicaciones del mundo real y profundizar la comprensión a través de discusiones guiadas. Este formato combinado garantiza tanto la autonomía como el apoyo personalizado, ayudando a los alumnos a alcanzar sus objetivos de manera eficiente y eficaz. Q\u0026A sessions October 19 - October 30 10:00 AM-11:00 AM (Mexico City) $700* English 27 hours Log in 66 seats available * Pricing does not include taxes and fees (such as Sales Taxes and VAT) prescribed by law Module Duration"}, {"title": "Customize Agent Inbox panel | Creatio Academy", "url": "https://academy.creatio.com/guides/dev/development-on-creatio-platform/category/agent-inbox-panel", "file": "paginas/73/73890da8b-agent-inbox-panel.html", "kind": "general", "description": "", "text": "Version: 10 Customize Agent Inbox panel Customize the item list Customize the chat view Show chat history Show messages in a custom layout References"}, {"title": "Manage chats in Creatio | Creatio Academy", "url": "https://academy.creatio.com/documents?id=15621", "file": "paginas/c6/c65eb40a7-documents.html", "kind": "general", "description": "Manage Creatio chats using the OmnichannelMessaging package and implement a custom channel provider to receive and handle messages.", "text": "Version: 10 On this page Manage chats in Creatio Level: intermediate Customers contact companies through different messengers, and agents need to handle these chats without switching between apps. Creatio lets agents process chats from Facebook Messenger, Telegram, and custom messengers in one place. The pre-installed OmnichannelMessaging package contains the basic functionality that lets you manage chats. Before using the functionality, set up chat processing. Instructions: Set up chat processing (user documentation). Manage chat functionality in Creatio ​ View the list of primary classes that let you manage chat functionality in the table below. Class Description MessageManager Enables the messenger integration with Creatio instance. FacebookOmnichannelMessagingService Receives and registers messages from Facebook Messenger. The class is based on the OmnichannelMessagingService class that contains the set methods that are common for both Facebook Messenger and Telegram. TelegramOmnichannelMessagingService Receives messages from Telegram. The class is based on the OmnichannelMessagingService class that contains the set methods that are common for both Facebook Messenger and Telegram. OmnichannelChatService Receives messages, chats of a specific agent, etc. OmnichannelOperatorService Receives and changes the agent status. Implement a custom channel provider ​ Previously, Creatio supported only one custom channel. All custom channels shared the single ChannelType.ThirdParty value, and Creatio routed messages using this value. Since version 10.1, you can register multiple custom channels . Each custom channel has its own channel name that Creatio uses to route messages to the corresponding classes. Existing integrations that implement a single custom channel continue to work when updating to version 10.1. 1. Add a channel provider to Creatio ​ Create a package . Instructions: Create a user-made package using Configuration section . Change the current package . Instructions: Change the current package . Click in the top right → System setup → Lookups . Open the \"Channel provider\" lookup . Click New to add the lookup value. Fill out the properties of the lookup value. The following example adds the \"SomeProvider\" channel provider. Property Description Example Name Unique name of the channel provider. SomeProvider Code Unique code of the channel provider. Available for Creatio 10.1 and later. Creatio uses the Code field to distinguish custom channel providers from out-of-the-box channel providers. Out-of-the-box channel providers use the ChannelType ordinal as the Code field value. Custom channel providers use \"1000\" and higher. Creatio requires this value to send messages when an agent opens a chat from a contact. Do not use codes of out-of-the-box channel providers. 1000 Save the changes . As a result , the custom channel provider will be added to Creatio. 2. Create a database table to store data of the custom channel provider ​ Creatio uses one dat"}, {"title": "Theming overview | Creatio Academy", "url": "https://academy.creatio.com/documents?id=2772", "file": "paginas/9c/9c1a285eb-documents.html", "kind": "general", "description": "Overview of Creatio theming that applies corporate colors and fonts to the interface: colors, fonts, roles, and permissions.", "text": "Version: 10 On this page Theming overview Level: beginner note Theming is available for Enterprise and Unlimited pricing plans. Learn more: Creatio Composable Pricing . Apply your corporate colors and fonts to Creatio so that the interface matches your other brand materials. To do this, select a theme, or create a theme that uses the brand colors without rebuilding a single page. Out of the box, Creatio runs the built-in \"Freedom\" theme. Colors and fonts ​ You can change the colors and fonts of the whole application at once: buttons, tabs, links, headings, and body text, on every page and in every section. Creatio extends theming coverage with each release. You can set a brand color for Creatio to generate a full palette of shades from it, along with text colors that remain readable on each shade. You can also set a heading font and a body font. Text sizes stay as they are, so the page layout stays the same. Learn more: Create a custom theme , Add a custom font to a theme . Roles and permissions ​ A user can select any theme the administrator made available. A personal theme applies to a single user only. Learn more: Customize the Freedom UI . An administrator can create themes from brand colors, choose which of them users can select, and set the theme that users receive unless they select a personal theme of their own. An administrator can also disable personal theme selection so that every user sees the same interface. Learn more: Create a custom theme , Manage themes . An administrator must have permission to the \"Can manage themes\" ( CanManageThemes code) system operation to create or change a theme. Learn more: Manage themes . See also ​ Create a custom theme Manage themes Add a custom font to a theme Customize the Freedom UI Colors and fonts Roles and permissions See also"}, {"title": "All Updates \u0026 Releases | Creatio Academy", "url": "https://academy.creatio.com/updates-and-releases", "file": "paginas/7e/7eeebd121-updates-and-releases.html", "kind": "general", "description": "The latest features, updates, and improvements – all in one place.", "text": "Log in Log in All Updates \u0026 Releases The latest features, updates, and improvements – all in one place. September 000 October, 2026 New Update September 000 October 19 New Customize Agent Inbox panel E-Learning Guide News Tech Hour Training Guide September 000 October 19 Update Manage chats in Creatio E-Learning Guide News Tech Hour Training Guide September 000 October 12 New Theming overview E-Learning Guide News Tech Hour Training Guide September 000 October 12 Update Requirements for Marketplace listing resources E-Learning Guide News Tech Hour Training Guide September 000 October 08 Update Button component E-Learning Guide News Tech Hour Training Guide September 000 October 06 New Migrate dashboards from Classic UI to Freedom UI E-Learning Guide News Tech Hour Training Guide September 000 October 05 New Required document overview E-Learning Guide News Tech Hour Training Guide September 000 October 05 New Dynamic parameter overview E-Learning Guide News Tech Hour Training Guide September 000 October 02 New 10.1 Unlimited release notes E-Learning Guide News Tech Hour Training Guide September 000 October 02 New 10.1 Unlimited changelog E-Learning Guide News Tech Hour Training Guide September 000 October 02 New 1.5 Bank.AI release notes E-Learning Guide News Tech Hour Training Guide September 000 October 02 New 1.5 Bank.AI changelog E-Learning Guide News Tech Hour Training Guide September 000 October 01 New Migrate remote module functionality to the deferred format E-Learning Guide News Tech Hour Training Guide September 000 October 01 New ​​​​​​Working with collection attributes when implementing Freedom UI Designer setup area E-Learning Guide News Tech Hour Training Guide September 000 October 01 New ​​​​Error handling when working with collection attributes E-Learning Guide News Tech Hour Training Guide September 000 October 01 New ​​​​Implement a Freedom UI Designer setup area for a collection-based custom Freedom UI component E-Learning Guide News Tech Hour Training Guide September 000 October 01 Update Localize custom Freedom UI component implemented using remote module E-Learning Guide News Tech Hour Training Guide September 000 October 01 Update ​​​​​Custom request handler implemented using remote module E-Learning Guide News Tech Hour Training Guide September 000 October 01 Update ​​​​​Implement a custom request handler using remote module E-Learning Guide News Tech Hour Training Guide September 000 October 01 Update ​​​​​Custom converter implemented using remote module E-Learning Guide News Tech Hour Training Guide September 000 October 01 Update ​​​​​Implement a custom converter using remote module E-Learning Guide News Tech Hour Training Guide September 000 October 01 Update ​​​​​​​​​​Custom validator implemented using remote module E-Learning Guide News Tech Hour Training Guide September 000 October 01 Update ​​​​​Implement a custom validator using remote module E-Learning Guide News Tech Hour Training Guide September 000 October 01 "}, {"title": "Overview | Creatio Academy", "url": "https://academy.creatio.com/guides/creatio-apps/category/overview", "file": "paginas/df/dff7902e9-overview.html", "kind": "general", "description": "", "text": "Version: 10 Overview Creatio Business Studio Sales Marketing Service Bank.AI Artifacts"}, {"title": "Customization tools | Creatio Academy", "url": "https://academy.creatio.com/guides/no-code-customization/category/customization-tools", "file": "paginas/7f/7f044c657-customization-tools.html", "kind": "general", "description": "", "text": "Version: 10 Customization tools Recommendations App management UI and business logic customization Custom localization System settings and lookups Print-ready reports Appearance customization Tags setup"}, {"title": "Creatio AI Studio overview | Creatio Academy", "url": "https://academy.creatio.com/guides/ai-studio/creatio-ai-studio-overview", "file": "paginas/0f/0fbde4b64-creatio-ai-studio-overview.html", "kind": "general", "description": "Overview of Creatio AI Studio for building, deploying, and operating AI Agents: AI Twin, designers, channels, governance, and runtime.", "text": "On this page Creatio AI Studio overview Creatio AI Studio is a unified environment in Creatio for building, deploying, and operating AI Agents. Use it to add AI to your business processes, with clear insight into what each agent does, control over how it behaves, and the ability to adjust it as your needs change. Creatio AI Studio brings together tools for designing, running, connecting, and managing agents. It supports several ways to build agents, from a conversation in plain language to a designer you fill out field by field. Teams with different technical backgrounds can create agents that fit their needs. The platform is LLM-agnostic, supports governance and observability at every stage, and is designed to grow with your organization as AI adoption expands across teams and workflows. Fig. 1 Creatio AI Studio New to the platform? Pick a first use case, then take one agent through the whole lifecycle in a single sitting. Learn more: Choose a use case for your first agent and Build, release, and monitor your first agent . AI Twin ​ AI Twin is the fastest way into the platform: describe the outcome you want in plain language, and it composes the agent for you — identity, system prompt, and the skills, knowledge sources, and integrations the job calls for. It is the chat on the Home page, and the landing surface out of the box. AI Twin is itself an agent, which is why it does not explain how to build an agent — it builds one. Ask for a change later and it refines the agent in place, keeping its deployment and channels intact. It publishes, deploys, and rolls back versions on request, reads back an agent's configuration and run traces, and creates knowledge sources. AI Twin also works with your Creatio data directly in the chat. Ask it to summarize your meetings for the week, review your open opportunities, or explain how a custom object is structured, and it answers from your live records, with links back to the exact ones you can open. Learn more: AI Twin overview and Create an agent with AI Twin . Prompt Agent Designer ​ Prompt Agent Designer lets you define an agent's role, behavior, and constraints using natural language instructions, with no coding required. Where AI Twin composes an agent for you, the designer is where you shape one yourself, field by field, and where every agent ends up once it exists. Fig. 2 Prompt agent Configure the agent's purpose, communication style, and first-message behavior directly in the designer. You can use a quick inline prompt for a specific task, or connect the agent to a reusable platform prompt for consistent behavior across multiple agents and use cases. You can also choose which AI model powers the agent. Prompt Agent Designer supports multiple LLM providers, including Anthropic Claude, OpenAI, and Google Gemini. You can tune model behavior per agent: adjust the temperature and decide how much the model reasons before it answers. Learn more: Connect a model provider . You can extend each agent with the "}, {"title": "Creatio AI app development toolkit | Creatio Academy", "url": "https://academy.creatio.com/guides/ai-development/creatio-ai-toolkit-overview", "file": "paginas/f5/f50edaf3b-creatio-ai-toolkit-overview.html", "kind": "general", "description": "Overview of the Creatio AI app development toolkit for coding agents: components, capabilities, use cases, and supported agents.", "text": "On this page Creatio AI app development toolkit Level: beginner Building a Creatio app takes time: you set up data models, design pages, and add logic in multiple designers. Creatio AI app development toolkit lets you build Creatio apps by describing what you need in plain language. A coding agent does the work for you. Coding agents are AI tools that create and configure code from your instructions, for example, Claude Code, Codex, and GitHub Copilot. The toolkit teaches the agent how Creatio works, so you can build apps without deep technical skills. Users and use cases ​ You can use the toolkit regardless of your technical background. No-code creators describe what they want to build in the agent chat and get a working app without writing code or working in designers. The more details they give, the better the result. To change an existing app, they describe the changes to the agent the same way. Developers delegate routine tasks to the agent, such as creating objects, adding fields, and adding logic. The agent generates code and configuration, which leaves developers more time for complex work. They can also work with Creatio through the agent instead of the UI. Toolkit components ​ An AI model alone does not know how to build apps in Creatio. The toolkit gives the coding agent the knowledge and tools it needs to work in Creatio correctly. The toolkit consists of the following components that work together: a Creatio plugin and skills for the coding agent that guide agent behavior MCP tools that let the agent work with Creatio directly, including Clio supporting tools that the agent uses in its work, such as .NET SDK, Python, and Git an installer that helps you install all needed tools and the Creatio plugin and skills Clio is a command-line utility for managing Creatio configurations. Learn more: Install Clio (developer documentation). With these components, the agent creates and configures apps without asking you to act at each step. Application development capabilities ​ After you set up the toolkit, the agent can take over the most time-consuming parts of app development. You can ask the agent to: create complete web applications within the Creatio environment build and modify data models that power application logic name objects, columns, and lookups according to Creatio conventions generate UI pages for web applications design new Freedom UI pages and audit existing ones for usability and accessibility create mobile pages and convert existing web pages to mobile pages create the most commonly used business rules and logic create business processes for Creatio 8.3.4 and later, including processes with branching, sub-processes, and script tasks, and help you test them create and modify dashboards, home pages, desktops, and workplaces with analytical widgets of any type, including pivot tables grant access permissions to dashboards, desktops, and workplaces add and manage sections across existing or new applications migrate Classic UI sect"}, {"title": "Getting started | Creatio Academy", "url": "https://academy.creatio.com/guides/dev/development-on-creatio-platform/category/getting-started", "file": "paginas/04/044db70d7-getting-started.html", "kind": "general", "description": "", "text": "Version: 10 Getting started Development recommendations"}];const q=document.querySelector("#q"),
